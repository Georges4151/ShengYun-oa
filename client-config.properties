# CEAMS 客户端配置
# 用于多台电脑连接中央数据库

# ===========================================
# 数据库连接配置
# ===========================================

# MySQL服务器地址(使用IP地址或域名,不要使用localhost)
DB_HOST=192.168.1.100

# MySQL端口
DB_PORT=3306

# 数据库名称
DB_NAME=ceams

# 数据库用户名(建议创建专用账户,不要使用root)
DB_USERNAME=ceams_client

# 数据库密码
DB_PASSWORD=请修改为你的密码

# ===========================================
# 应用配置
# ===========================================

# 日志级别(DEBUG, INFO, WARN, ERROR)
LOG_LEVEL=INFO

# 票据上传路径
RECEIPT_PATH=./rephoto

# ===========================================
# 安全配置
# ===========================================

# 是否启用SSL连接(需要MySQL服务器配置SSL)
DB_USE_SSL=false

# JWT密钥(与应用服务器保持一致)
JWT_SECRET=你的JWT密钥

# JWT过期时间(毫秒)
JWT_EXPIRATION=86400000

# ===========================================
# Redis配置(如果使用)
# ===========================================

REDIS_HOST=192.168.1.100
REDIS_PORT=6379
REDIS_PASSWORD=
REDIS_DATABASE=0
