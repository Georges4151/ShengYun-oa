# 数据库配置
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ceams}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis配置
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.ceams.model.entity
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.cache-enabled=false
mybatis.configuration.jdbc-type-for-null=OTHER

# Spring Security配置
spring.security.user.name=${SECURITY_ADMIN_NAME:admin}
spring.security.user.password=${SECURITY_ADMIN_PASSWORD:}
spring.security.user.roles=ADMIN

# 日志配置
logging.level.root=${LOG_LEVEL:INFO}
logging.level.com.ceams=${APP_LOG_LEVEL:INFO}
logging.level.org.mybatis=${MYBATIS_LOG_LEVEL:INFO}
logging.level.java.sql=${SQL_LOG_LEVEL:INFO}
logging.file.name=./logs/ceams.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# 文件上传配置
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB

# 应用配置
ceams.app.name=建筑企业账目管理系统
ceams.app.version=1.0.0
ceams.app.description=专为建筑企业设计的账目管理系统

# 备份配置
ceams.backup.path=./backup
ceams.backup.interval=24
ceams.backup.keep-days=30

# OCR配置
ceams.ocr.data-path=./tessdata
ceams.ocr.language=chi_sim

# 票据存储路径
ceams.receipt.path=./rephoto

# 服务器配置
server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${SERVER_PORT:9095}

# JWT配置
jwt.secret=${JWT_SECRET:CEAMS-JWT-SECRET-KEY-2024-DEVELOPMENT-ONLY}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Redis配置
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.database=${REDIS_DATABASE:0}

# 邮件配置
spring.mail.host=${MAIL_HOST:smtp.qq.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# CORS配置 - 允许的来源（移动端需要确保服务器IP在这里配置）
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:9095}
cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
cors.allowed-headers=${CORS_ALLOWED_HEADERS:Authorization,Content-Type,X-Requested-With}
cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:true}
cors.max-age=${CORS_MAX_AGE:3600}
