# ============================================
# CEAMS - Database Configuration (Docker - Local MySQL)
# ============================================

# Server Configuration
server.port=9095
server.address=0.0.0.0

# Database Configuration (Local MySQL)
spring.datasource.url=jdbc:mysql://host.docker.internal:3306/ceams?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456

# Redis Configuration
spring.data.redis.host=redis
spring.data.redis.port=6379
spring.data.redis.password=

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB

# Logging Configuration
logging.file.path=/app/logs
logging.level.root=INFO
logging.level.com.ceams=DEBUG

# Backup Configuration
backup.path=/app/backup
backup.auto=true
backup.interval.days=1

# Receipt Photo Configuration
receipt.photo.path=/app/rephoto

# Security Configuration
jwt.secret=CEAMS-JWT-SECRET-KEY-2024-REPLACE-IN-PRODUCTION
jwt.expiration.hours=24

# Electronic Seal Configuration
seal.path=/app/seals
