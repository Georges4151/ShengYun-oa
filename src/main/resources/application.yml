server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: ceams
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:ceams}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      pool-name: CeamsHikariPool
  flyway:
    enabled: true
    locations: classpath:db/migration
    encoding: UTF-8
    baseline-on-migrate: false
    validate-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:mapper/**/*.xml

ceams:
  jwt:
    # 生产环境务必通过环境变量覆盖（长度不低于 32 字节以支持 HS256）
    secret: ${JWT_SECRET:ceams-jwt-secret-2026-change-me-in-production-0123456789abcdefABCDEF}
    access-ttl-seconds: 900
    refresh-ttl-seconds: 604800
  sign:
    # 请求签名校验已切换为「按设备 AppSecret」校验（见 DeviceAppSecretResolver），
    # 全局共享密钥 ceams.sign.secret 已废弃移除，不再参与任何签名校验。
    # 签名时间戳允许偏差（毫秒），默认 ±5 分钟
    window-millis: ${SIGN_WINDOW_MILLIS:300000}
  sensitive:
    # 敏感字段 AES-256-GCM 加密密钥（Base64 编码的 32 字节）。
    # 生产环境务必通过 CEAMS_SENSITIVE_KEY 环境变量覆盖，仓库内仅保留 dev 占位默认值。
    secret: ${CEAMS_SENSITIVE_KEY:Y2VhbXMtc2Vuc2l0aXZlLWRldi1rZXktMjAyNi0wMTI=}
  export:
    # 导出/下载签名 URL 专用密钥（仅服务端生成与校验下载链接，与请求 HMAC 的 AppSecret 无关）。
    # 生产环境务必通过 EXPORT_SECRET 环境变量覆盖，仓库内仅保留 dev 占位默认值。
    secret: ${EXPORT_SECRET:ceams-export-secret-2026-change-me-in-production-abcdef0123456789ABCDEF}
    # 下载签名 URL 有效期（毫秒），默认 5 分钟
    url-ttl-millis: ${EXPORT_URL_TTL_MILLIS:300000}
  file:
    # 轻量文件上传/下载落盘目录（票据附件等），生产可用 FILE_UPLOAD_DIR 覆盖。
    upload-dir: ${FILE_UPLOAD_DIR:./data/files}
  ai:
    # 本地 Ollama 智能化开关，默认关闭；置 true 且 Ollama 可达后才对外提供 AI 能力。
    enabled: ${AI_ENABLED:false}
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    # 本机已安装 qwen2.5:7b（即指令微调版）；可通过 OLLAMA_MODEL 覆盖（如 qwen2.5:14b-instruct）。
    model: ${OLLAMA_MODEL:qwen2.5:7b}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:120}
    max-context-messages: 10
    max-tool-rows: 200
    stream: true

  # 备份加密说明（占位）：
  #   数据库备份必须在运维层加密，例如 mysqldump 管道加密（openssl/gpg）或使用托管数据库的自动备份加密；
  #   应用内不落地任何备份功能，亦不生成备份文件或备份代码。

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: info
    com.ceams: info
    org.flywaydb: info
    org.springframework.security: warn