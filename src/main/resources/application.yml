server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: ceams
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:ceams}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      pool-name: CeamsHikariPool
  flyway:
    enabled: true
    locations: classpath:db/migration
    encoding: UTF-8
    baseline-on-migrate: false
    validate-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:mapper/**/*.xml

ceams:
  cache:
    # 业务缓存总开关（权限树 / 分类树等字典缓存）；关闭后接口自动降级为直查数据库
    enabled: ${CEAMS_CACHE_ENABLED:true}
  jwt:
    # 生产环境务必通过环境变量覆盖（长度不低于 32 字节以支持 HS256）
    secret: ${JWT_SECRET:ceams-jwt-secret-2026-change-me-in-production-0123456789abcdefABCDEF}
    access-ttl-seconds: 900
    refresh-ttl-seconds: 604800
  sign:
    # 请求签名校验已切换为「按设备 AppSecret」校验（见 DeviceAppSecretResolver），
    # 全局共享密钥 ceams.sign.secret 已废弃移除，不再参与任何签名校验。
    # 签名时间戳允许偏差（毫秒），默认 ±5 分钟
    window-millis: ${SIGN_WINDOW_MILLIS:300000}
  sensitive:
    # 敏感字段 AES-256-GCM 加密密钥（Base64 编码的 32 字节）。
    # 生产环境务必通过 CEAMS_SENSITIVE_KEY 环境变量覆盖，仓库内仅保留 dev 占位默认值。
    secret: ${CEAMS_SENSITIVE_KEY:Y2VhbXMtc2Vuc2l0aXZlLWRldi1rZXktMjAyNi0wMTI=}
  export:
    # 导出/下载签名 URL 专用密钥（仅服务端生成与校验下载链接，与请求 HMAC 的 AppSecret 无关）。
    # 生产环境务必通过 EXPORT_SECRET 环境变量覆盖，仓库内仅保留 dev 占位默认值。
    secret: ${EXPORT_SECRET:ceams-export-secret-2026-change-me-in-production-abcdef0123456789ABCDEF}
    # 下载签名 URL 有效期（毫秒），默认 5 分钟
    url-ttl-millis: ${EXPORT_URL_TTL_MILLIS:300000}
  file:
    # 轻量文件上传/下载落盘目录（票据附件等），生产可用 FILE_UPLOAD_DIR 覆盖。
    upload-dir: ${FILE_UPLOAD_DIR:./data/files}
  ai:
    # 本地 Ollama 智能化开关，默认关闭；置 true 且 Ollama 可达后才对外提供 AI 能力。
    enabled: ${AI_ENABLED:false}
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    # 本机已安装 qwen2.5:7b（即指令微调版）；可通过 OLLAMA_MODEL 覆盖（如 qwen2.5:14b-instruct）。
    model: ${OLLAMA_MODEL:qwen2.5:7b}
    # 票据图片识别使用的视觉模型（需支持图像输入），可通过 OLLAMA_VISION_MODEL 覆盖。
    vision-model: ${OLLAMA_VISION_MODEL:qwen2.5vl:7b}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:120}
    max-context-messages: 10
    max-tool-rows: 200
    stream: true
    summary:
      schedule-enabled: ${AI_SUMMARY_SCHEDULE_ENABLED:true}
      # 经营日报定时生成表达式，默认每天 08:00。
      cron: "${AI_SUMMARY_CRON:0 0 8 * * ?}"
      max-catch-up-days: ${AI_SUMMARY_MAX_CATCH_UP_DAYS:7}
      polish-enabled: ${AI_SUMMARY_POLISH_ENABLED:true}
    preaudit:
      amount-threshold: ${AI_PREAUDIT_AMOUNT_THRESHOLD:5000}
      budget-usage-warn-percent: 90
      budget-usage-high-percent: 100
    contract-risk:
      # 是否允许 AI 复述合同要点与风险提示（仍需 AI_ENABLED=true）。
      ai-note-enabled: ${AI_CONTRACT_RISK_NOTE_ENABLED:true}
    todo-summary:
      # 是否允许 AI 润色待办摘要（仍需 AI_ENABLED=true，失败自动回退规则模板）。
      polish-enabled: ${AI_TODO_SUMMARY_POLISH_ENABLED:true}
      # 最近到期清单条数（1~20）
      upcoming-limit: ${AI_TODO_SUMMARY_UPCOMING_LIMIT:5}
  bpm:
    # 节点未配置 dueHours 时的默认超时时长（小时）
    default-due-hours: ${BPM_DEFAULT_DUE_HOURS:24}
    # 已废弃：DEPT_LEADER 改为按 sys_dept.leader_id -> sys_user.leader_id 解析，保留该配置仅为兼容
    dept-leader-role-code: ${BPM_DEPT_LEADER_ROLE_CODE:}
    timeout:
      # 是否启用超时提醒定时任务（默认开启）
      enabled: ${BPM_TIMEOUT_ENABLED:true}
      # 超时提醒定时表达式，默认每 30 分钟扫描一次（同一任务仅提醒一次）
      cron: "${BPM_TIMEOUT_CRON:0 0/30 * * * ?}"
      # 单批查询条数上限，禁止一次全表扫描
      batch-size: ${BPM_TIMEOUT_BATCH_SIZE:200}
      # 定时/外部调度按片拉取时的分片总数
      shard-total: ${BPM_TIMEOUT_SHARD_TOTAL:4}
  hr:
    checkin:
      # 无排班时的默认上班/下班时间
      default-start: "${HR_CHECKIN_DEFAULT_START:09:00}"
      default-end: "${HR_CHECKIN_DEFAULT_END:18:00}"
      # 迟到/早退宽限分钟数
      grace-minutes: ${HR_CHECKIN_GRACE_MINUTES:10}
      # 是否要求先排班才能打卡（默认 false：非排班日允许打卡）
      require-schedule: ${HR_CHECKIN_REQUIRE_SCHEDULE:false}
    # 月度工资核算规则（M2 P4）：金额统一 BigDecimal，禁止 double
    payroll:
      # 月计薪天数：日工资 = (基本工资 + 岗位工资) / working-days
      working-days: ${HR_PAYROLL_WORKING_DAYS:21.75}
      # 社保个人比例（基数取基本工资 + 岗位工资并夹在上下限之间）
      social-insurance-rate: ${HR_SOCIAL_INSURANCE_RATE:0.105}
      # 公积金个人比例
      housing-fund-rate: ${HR_HOUSING_FUND_RATE:0.07}
      # 社保 / 公积金缴费基数下限与上限
      social-base-min: ${HR_SOCIAL_BASE_MIN:0}
      social-base-max: ${HR_SOCIAL_BASE_MAX:999999}
      # 个税起征点（每月）
      tax-threshold: ${HR_TAX_THRESHOLD:5000}
      # 每次迟到 / 早退扣款金额
      late-deduction: ${HR_LATE_DEDUCTION:50}
      # 病假扣款比例（病假扣款 = 日工资 × 病假天数 × 该比例）
      sick-deduction-rate: ${HR_SICK_DEDUCTION_RATE:0.4}
  doc:
    # 单文件上传上限（字节），默认 200MB；超出直接拒绝
    max-file-size: ${DOC_MAX_FILE_SIZE:209715200}
    # 分片大小（字节），默认 5MB；分片数上限 1000
    chunk-size: ${DOC_CHUNK_SIZE:5242880}
    # 编辑锁有效期（分钟），过期后自动可用
    lock-ttl-minutes: ${DOC_LOCK_TTL_MINUTES:30}
    # 一次性下载 token 有效期（秒）
    download-token-ttl-seconds: ${DOC_DOWNLOAD_TOKEN_TTL_SECONDS:300}
    # 分片临时目录与上传 meta 的保留时长（小时）
    upload-temp-ttl-hours: ${DOC_UPLOAD_TEMP_TTL_HOURS:24}
    # RAG 文档知识库（抽取 + 分块 + 全文检索）；关闭后索引任务直接 SKIPPED，上传/下载/预览不受影响
    rag:
      # 是否启用文本抽取与索引
      enabled: ${DOC_RAG_ENABLED:true}
      # 分块目标长度（字符）与相邻分块重叠字符数
      chunk-size: ${DOC_RAG_CHUNK_SIZE:600}
      chunk-overlap: ${DOC_RAG_CHUNK_OVERLAP:100}
      # 单文件最大抽取字符数（超出截断）
      max-extract-chars: ${DOC_RAG_MAX_EXTRACT_CHARS:2000000}
      # 检索召回候选条数上限 / 默认返回条数 / 最大返回条数
      search-candidate-limit: ${DOC_RAG_SEARCH_CANDIDATE_LIMIT:300}
      search-default-limit: ${DOC_RAG_SEARCH_DEFAULT_LIMIT:5}
      max-search-limit: ${DOC_RAG_MAX_SEARCH_LIMIT:10}
    # OnlyOffice 在线编辑（不可用时 editor-config 返回 503，上传/下载/版本不受影响）
    onlyoffice:
      # 在线编辑总开关，默认关闭
      enabled: ${ONLYOFFICE_ENABLED:false}
      # Document Server 地址（服务端探活与回调来源校验）
      document-server-url: ${ONLYOFFICE_URL:http://onlyoffice}
      # Document Server 的浏览器可达地址（前端据此加载 api.js，不能填容器内服务名）
      browser-document-server-url: ${ONLYOFFICE_BROWSER_URL:http://localhost:8081}
      # CEAMS 对 Document Server 暴露的基地址。
      # 注意：public-base-url 必须是 Document Server 容器可达的地址（本地 compose 为 http://app:9095），
      # 不能填 localhost，否则 Document Server 无法拉取原件与回调保存。
      public-base-url: ${CEAMS_PUBLIC_URL:http://app:9095}
      # 与 Document Server 的 JWT_SECRET 保持一致；为空时在线编辑不可用
      jwt-secret: ${ONLYOFFICE_JWT_SECRET:}
      # 保存回调路径（与 OnlyOfficeController 映射一致）
      callback-path: ${ONLYOFFICE_CALLBACK_PATH:/api/v1/doc/onlyoffice/callback}
      # 连接超时（毫秒），探活与回调下载共用
      connect-timeout-millis: ${ONLYOFFICE_CONNECT_TIMEOUT_MILLIS:2000}
      # 读取超时（毫秒），保存回调下载文档体
      read-timeout-millis: ${ONLYOFFICE_READ_TIMEOUT_MILLIS:30000}
  wecom:
    # 企业微信应用集成（组织同步 / 扫码登录 / 应用消息）；与群机器人 ceams.notification.wecom.* 相互独立
    enabled: ${WECOM_APP_ENABLED:false}
    corp-id: ${WECOM_APP_CORP_ID:}
    agent-id: ${WECOM_APP_AGENT_ID:}
    secret: ${WECOM_APP_SECRET:}
    api-base-url: ${WECOM_APP_API_BASE_URL:https://qyapi.weixin.qq.com}
    login-base-url: ${WECOM_APP_LOGIN_BASE_URL:https://login.work.weixin.qq.com}
    redirect-uri: ${WECOM_APP_REDIRECT_URI:http://localhost:5173/login/wecom}
    # 组织同步定时表达式，默认每天 02:00
    sync-cron: "${WECOM_APP_SYNC_CRON:0 0 2 * * ?}"
    dispatch-interval-ms: ${WECOM_APP_DISPATCH_INTERVAL_MS:30000}
    message-retry-max: ${WECOM_APP_MESSAGE_RETRY_MAX:5}
    timeout-millis: ${WECOM_APP_TIMEOUT_MILLIS:5000}
  admin:
    # 到期类预警窗口（天），用于车辆保险 / 年检等后续功能
    alert-days: ${ADMIN_ALERT_DAYS:30}
    # 访客二维码核销有效期（小时），预留给后续访客模块
    qr-checkin-window-hours: ${ADMIN_QR_CHECKIN_WINDOW_HOURS:24}
  notification:
    wecom:
      # 企业微信群机器人推送开关，默认关闭；配置 WECOM_WEBHOOK_URL 后再开启。
      enabled: ${WECOM_ENABLED:false}
      webhook-url: ${WECOM_WEBHOOK_URL:}
      # 单次请求连接/读取超时（毫秒）
      timeout-millis: ${WECOM_TIMEOUT_MILLIS:3000}
      # 单条消息正文最大长度，超出截断
      max-content-length: ${WECOM_MAX_CONTENT_LENGTH:800}

  # 备份加密说明（占位）：
  #   数据库备份必须在运维层加密，例如 mysqldump 管道加密（openssl/gpg）或使用托管数据库的自动备份加密；
  #   应用内不落地任何备份功能，亦不生成备份文件或备份代码。

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ceams

logging:
  level:
    root: info
    com.ceams: info
    org.flywaydb: info
    org.springframework.security: warn