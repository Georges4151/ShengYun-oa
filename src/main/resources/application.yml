server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: ceams
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:ceams}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      pool-name: CeamsHikariPool
  flyway:
    enabled: true
    locations: classpath:db/migration
    encoding: UTF-8
    baseline-on-migrate: false
    validate-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:mapper/**/*.xml

ceams:
  jwt:
    # 生产环境务必通过环境变量覆盖（长度不低于 32 字节以支持 HS256）
    secret: ${JWT_SECRET:ceams-jwt-secret-2026-change-me-in-production-0123456789abcdefABCDEF}
    access-ttl-seconds: 900
    refresh-ttl-seconds: 604800
  sign:
    # 高危接口 HMAC 签名共享密钥（生产环境务必通过 SIGN_SECRET 环境变量覆盖）
    secret: ${SIGN_SECRET:ceams-sign-secret-2026-change-me-in-production-9876543210fedcbaFEDCBA}
    # 签名时间戳允许偏差（毫秒），默认 ±5 分钟
    window-millis: ${SIGN_WINDOW_MILLIS:300000}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: info
    com.ceams: info
    org.flywaydb: info
    org.springframework.security: warn