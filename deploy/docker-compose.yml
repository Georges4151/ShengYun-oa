# ================= CEAMS 生产部署编排 =================
# 用法：在本目录(deploy)下准备 .env 后执行 `docker compose up -d --build`
# 敏感值（密码/密钥）通过环境变量注入，禁止硬编码真实凭据。

services:
  mysql:
    image: mysql:8.0
    container_name: ceams-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ceams}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # 仅暴露给 compose 内部网络，不映射到宿主机公网端口
    expose:
      - "3306"

  redis:
    image: redis:7-alpine
    container_name: ceams-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    expose:
      - "6379"

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: ceams-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # MySQL
      MYSQL_HOST: mysql
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ceams}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # 敏感密钥
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置 JWT_SECRET}
      CEAMS_SENSITIVE_KEY: ${CEAMS_SENSITIVE_KEY:?请在 .env 中设置 CEAMS_SENSITIVE_KEY}
      EXPORT_SECRET: ${EXPORT_SECRET:?请在 .env 中设置 EXPORT_SECRET}
      # AI（默认关闭）：启用后摘要与票据识别走本编排内的 ollama 服务
      AI_ENABLED: ${AI_ENABLED:-false}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-qwen2.5vl:7b}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-300}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  # Ollama 模型服务：仅监听宿主机回环地址，同时供 compose 内部网络访问。
  # 首次部署需手动拉取模型（模型体积大，建议在业务低峰执行）：
  #   docker exec ceams-ollama ollama pull qwen2.5:7b
  #   docker exec ceams-ollama ollama pull qwen2.5vl:7b
  ollama:
    image: ollama/ollama:latest
    container_name: ceams-ollama
    restart: unless-stopped
    # 仅绑定回环地址，避免将无鉴权的 Ollama 暴露到公网
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_KEEP_ALIVE: "30m"
      TZ: Asia/Shanghai
    volumes:
      - ollama-data:/root/.ollama
    # GPU 推理需要宿主机安装 NVIDIA 驱动与 nvidia-container-toolkit；
    # 若生产主机没有 GPU，请删除或注释掉下面整段 deploy 配置。
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  mysql-data:
  redis-data:
  ollama-data: