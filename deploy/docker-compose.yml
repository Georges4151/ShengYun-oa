# ================= CEAMS 生产部署编排 =================
# 用法：在本目录(deploy)下准备 .env 后执行 `docker compose up -d --build`
# 敏感值（密码/密钥）通过环境变量注入，禁止硬编码真实凭据。

services:
  mysql:
    image: mysql:8.0
    container_name: ceams-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ceams}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # 仅暴露给 compose 内部网络，不映射到宿主机公网端口
    expose:
      - "3306"

  redis:
    image: redis:7-alpine
    container_name: ceams-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    expose:
      - "6379"

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: ceams-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # MySQL
      MYSQL_HOST: mysql
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ceams}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # 安全密钥
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置 JWT_SECRET}
      CEAMS_SENSITIVE_KEY: ${CEAMS_SENSITIVE_KEY:?请在 .env 中设置 CEAMS_SENSITIVE_KEY}
      EXPORT_SECRET: ${EXPORT_SECRET:?请在 .env 中设置 EXPORT_SECRET}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

volumes:
  mysql-data:
  redis-data: